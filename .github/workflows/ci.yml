name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref の古い実行は打ち切って最新だけを走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json に packageManager フィールドが無いため明示指定する。
          # pnpm-lock.yaml は lockfileVersion 9.0（pnpm 9+）で、ローカルは 10 系。
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Zip for store submission
        run: pnpm zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: shotcraft-zip
          path: .output/*.zip
          retention-days: 14
          if-no-files-found: error
          # .output はドット始まりの隠しディレクトリのため、これが無いと除外されて
          # "No files were found" で失敗する（upload-artifact v4 の仕様）
          include-hidden-files: true
