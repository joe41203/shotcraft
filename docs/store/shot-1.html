<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>shotcraft — ヒーロー</title>
    <link rel="stylesheet" href="./store.css" />
    <style>
      /* shot-1: ヒーロー。左にコピー、右に実エディタ画像を大きくブラウザ風フレームで配置。 */
      .hero {
        display: grid;
        grid-template-columns: 540px 1fr;
        align-items: center;
        height: 100%;
        padding: 0 0 0 64px;
        gap: 8px;
      }
      .hero-copy .brandbar {
        margin-bottom: 34px;
      }
      .hero-copy h1 {
        margin: 0;
        font-size: 45px;
        font-weight: 800;
        line-height: 1.3;
        letter-spacing: 0.005em;
      }
      .hero-copy h1 .hl {
        color: var(--accent-hover);
        white-space: nowrap;
      }
      .hero-copy .sub {
        margin: 26px 0 0;
        font-size: 21px;
        color: var(--text-muted);
        line-height: 1.72;
        max-width: 27ch;
      }
      .hero-copy .sub .lock {
        color: var(--text);
        font-weight: 700;
        white-space: nowrap;
      }
      .hero-copy .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 11px;
        margin-top: 34px;
        max-width: 430px;
      }
      .hero-copy .chip {
        font-size: 17px;
        font-weight: 600;
        color: var(--text-muted);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 9px 16px;
      }
      .hero-copy .chip.accent {
        color: var(--accent-text);
        background: var(--accent);
        border-color: transparent;
        font-weight: 700;
      }

      /* 右側の画像ステージ。画面外へはみ出させて臨場感を出しつつキャンバス内で塗る。 */
      .hero-stage {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      .hero-stage .browser {
        position: absolute;
        top: 50%;
        left: 40px;
        width: 940px;
        transform: translateY(-50%) rotate(-2.2deg);
        transform-origin: center;
      }
      /* アクセントの発光 */
      .hero-stage::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        right: -120px;
        top: -120px;
        background: radial-gradient(circle, rgba(52, 211, 153, 0.22), transparent 68%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="hero">
        <div class="hero-copy">
          <div class="brandbar">
            <img src="./icon-128.png" alt="shotcraft" />
            <span class="name">shot<b>craft</b></span>
          </div>
          <h1>撮って、その場で<br /><span class="hl">注釈・モザイク・クロップ</span>。</h1>
          <p class="sub">
            完結は<span class="lock">ブラウザの中</span>。<br />画像は外に送られません。
          </p>
          <div class="chips">
            <span class="chip accent">編集ツールが充実</span>
            <span class="chip">完全ローカル動作</span>
            <span class="chip">無料・登録不要</span>
          </div>
        </div>

        <div class="hero-stage">
          <div class="browser">
            <div class="chrome">
              <span class="dot r"></span>
              <span class="dot y"></span>
              <span class="dot g"></span>
              <span class="addr">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
                shotcraft — 編集タブ
              </span>
            </div>
            <img class="shot" src="./editor-annotations.png" alt="注釈・モザイク・矩形強調を施した shotcraft の編集画面" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
