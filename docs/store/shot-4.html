<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>shotcraft — プライバシー</title>
    <link rel="stylesheet" href="./store.css" />
    <style>
      /* shot-4: すべてローカルで完結することを伝える。
         上に見出し、下に安心3点を大きく並べる。 */
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 76px;
        gap: 44px;
      }
      .head { text-align: center; }
      .head .eyebrow { margin-bottom: 18px; }
      .head h1 {
        margin: 0;
        font-size: 46px;
        font-weight: 800;
        line-height: 1.28;
      }
      .head h1 .n { color: var(--accent-hover); }
      .head .sub {
        margin: 18px auto 0;
        font-size: 20px;
        color: var(--text-muted);
        max-width: 56ch;
      }

      /* 安心3点 */
      .safe {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
        max-width: 880px;
        margin: 0 auto;
      }
      .safe .item {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 30px 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
      }
      .safe .ic {
        flex: 0 0 auto;
        width: 62px;
        height: 62px;
        border-radius: var(--radius-md);
        display: grid;
        place-items: center;
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .safe .ic svg { width: 34px; height: 34px; color: var(--accent-hover); }
      .safe .item h3 { margin: 0 0 6px; font-size: 26px; font-weight: 700; color: var(--text); }
      .safe .item p { margin: 0; font-size: 19px; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="wrap">
        <div class="head">
          <span class="eyebrow">プライバシー</span>
          <h1>撮った画像は、<span class="n">外に出ません</span>。</h1>
          <p class="sub">撮影から保存まで、ぜんぶブラウザの中だけで完結します。</p>
        </div>

        <div class="safe">
          <div class="item">
            <div class="ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.2L4 17.2V4Z" /><line x1="8" y1="9" x2="16" y2="9" /><line x1="4" y1="4" x2="20" y2="16" /></svg>
            </div>
            <div>
              <h3>外部送信なし</h3>
              <p>画像は外に送られません</p>
            </div>
          </div>
          <div class="item">
            <div class="ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></svg>
            </div>
            <div>
              <h3>アカウント不要</h3>
              <p>無料・登録なしで使える</p>
            </div>
          </div>
          <div class="item">
            <div class="ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            </div>
            <div>
              <h3>よけいな権限は求めません</h3>
              <p>閲覧履歴などは見ません</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
