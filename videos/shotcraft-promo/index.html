<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0f19;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="2.8"
        data-track-index="0"
      ></div>

      <div
        id="el-02-value"
        class="scene"
        data-composition-id="02-value"
        data-composition-src="compositions/frames/02-value.html"
        data-start="2.8"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-editor"
        class="scene"
        data-composition-id="03-editor"
        data-composition-src="compositions/frames/03-editor.html"
        data-start="5.8"
        data-duration="3.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-annotate"
        class="scene"
        data-composition-id="04-annotate"
        data-composition-src="compositions/frames/04-annotate.html"
        data-start="9.2"
        data-duration="6.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-proof"
        class="scene"
        data-composition-id="05-proof"
        data-composition-src="compositions/frames/05-proof.html"
        data-start="15.6"
        data-duration="3.9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="19"
        data-duration="3"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-value", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5.8);
        tl.fromTo("#el-03-editor", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5.8);
        tl.to("#el-05-proof", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.to({}, { duration: 22 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
