  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–0.8s) — press-release-spring on 「PNG保存」
         入力は linear の圧縮、出力は back.out のスプリング復帰。
         RELEASE_START = PRESS_START + PRESS_DUR で状態連続性を担保する。 */
      var PRESS_START = 0.1;
      var PRESS_DUR = 0.16; // subtle variation
      var RELEASE_START = PRESS_START + PRESS_DUR; // 0.26 — 隣接が連続性の条件

      tl.to(
        "#pf05-save",
        {
          scale: 0.96, // subtle press
          boxShadow: "0 2px 6px rgba(16,185,129,0.22)",
          duration: PRESS_DUR,
          ease: "power1.in",
        },
        PRESS_START,
      );
      tl.to(
        "#pf05-save",
        {
          scale: 1,
          boxShadow: "0 6px 18px rgba(16,185,129,0.32)",
          duration: 0.46,
          ease: "back.out(1.4)", // BOUNCE_FACTOR 1.4 — soft
        },
        RELEASE_START,
      );

      // バーストはボタンの背後で開き、すぐ引く（burst は blur 担当・shadow は触らない）
      tl.fromTo(
        "#pf05-burst",
        { scale: 1, opacity: 0 },
        { scale: 3, opacity: 0.6, duration: 0.34, ease: "power2.out" },
        RELEASE_START,
      );
      tl.to("#pf05-burst", { opacity: 0, duration: 0.4, ease: "power2.in" }, RELEASE_START + 0.34);

      // 保存されたファイル名チップが板の下端からせり上がる
      tl.fromTo(
        "#pf05-file",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.34,
      );

      /* ── Scene 2 (0.8–2.0s) — 板が引いて背景化（scale 1.0 → 0.9 / opacity 1 → 0.25） */
      tl.fromTo(
        "#pf05-panel",
        { scale: 1, opacity: 1 },
        { scale: 0.9, opacity: 0.25, duration: 0.6, ease: "power3.out" },
        0.85,
      );
      // ファイル名チップも板と一緒に沈める（手前の権限チップに主役を譲る）
      tl.to("#pf05-file", { opacity: 0.3, duration: 0.5, ease: "power2.out" }, 0.95);

      // スクリムが板と同時に立ち上がり、明るいダッシュボードを沈める
      tl.fromTo(
        "#pf05-scrim",
        { opacity: 0 },
        { opacity: 0.55, duration: 0.6, ease: "power3.out" },
        0.85,
      );

      // 権限チップが左から 0.2s 間隔で 3 つ入る
      tl.fromTo(
        "#pf05-perm-1",
        { x: -66, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.0,
      );
      tl.fromTo(
        "#pf05-perm-2",
        { x: -66, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.2,
      );
      tl.fromTo(
        "#pf05-perm-3",
        { x: -66, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.4,
      );

      /* ── Scene 3 (2.0–3.4s) — チップ列の直下に主張の一行がフェードで留まる。以後静止。 */
      tl.fromTo(
        "#pf05-claim",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        2.05,
      );

      /* handoff_out: 板は opacity 0.25 / scale 0.9 のまま薄く残る。
         exit なし — 次フレームが完全消去とアイコン実体化を担う。 */
      tl.to({}, { duration: 3.4 }, 0);

      window.__timelines["05-proof"] = tl;
    })();
  </script>
