      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-0.7s) — the scale-swap on one shared centre.

      // tween is needed and the frame is correct under seek.

        "#cta04-lockup",
        { xPercent: 0, x: -76.8 },
        { xPercent: -50, x: 0, duration: 0.5, ease: "power3.out" },
