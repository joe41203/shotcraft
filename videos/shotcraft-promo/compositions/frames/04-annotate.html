  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var tl = gsap.timeline({ paused: true });

      var ACTIVE_BG = "#10b981";
      var ACTIVE_FG = "#0b0f19";
      var IDLE_BG = "rgba(0,0,0,0)";
      var IDLE_FG = "#9aa6b8";

      // ツールバーのアクティブ切替（0 秒 set で seek-safe）
      function activate(onSel, offSel, at) {
        tl.set(offSel, { backgroundColor: IDLE_BG, color: IDLE_FG }, at);
        tl.set(onSel, { backgroundColor: ACTIVE_BG, color: ACTIVE_FG }, at);
      }

      // ── Scene 1 (0.0–1.5s) モザイク ──────────────────────────
      // t=0 は Frame 3 とまったく同じ状態（選択ツールがアクティブ）。
      // 0.12s でモザイクツールへ持ち替える。
      activate("#an04-t-mosaic", "#an04-t-select", 0.12);

      // 粗いピクセルブロックが左から順に埋まる（合計 0.35s）
      tl.fromTo(
        "#an04-mosaic i",
        { opacity: 0 },
        {
          opacity: 1,
          duration: 0.12,
          ease: "power3.out",
          stagger: { each: 0.0096, from: "start" },
        },
        0.22,
      );

      tl.fromTo(
        "#an04-label-1",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        0.12,
      );
      tl.to("#an04-label-1", { opacity: 0, duration: 0.26, ease: "power3.in" }, 1.24);
      tl.set("#an04-label-1", { opacity: 0 }, 1.5);

      // ── Scene 2 (1.5–3.2s) 矢印とテキスト ────────────────────
      activate("#an04-t-arrow", "#an04-t-mosaic", 1.55);

      // 先にコーラルのテキストが出る
      tl.fromTo(
        "#an04-arrowtext",
        { y: 8, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" },
        1.62,
      );

      // そこから金曜の棒へ矢印が伸びる。width を伸ばすので頭は潰れない。
      tl.fromTo(
        "#an04-arrow",
        { width: "0cqw", opacity: 1 },
        { width: "9.25cqw", duration: 0.45, ease: "power3.out" },
        2.02,
      );

      tl.fromTo(
        "#an04-label-2",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        1.58,
      );
      tl.to("#an04-label-2", { opacity: 0, duration: 0.26, ease: "power3.in" }, 2.94);
      tl.set("#an04-label-2", { opacity: 0 }, 3.2);

      // ── Scene 3 (3.2–4.7s) 矩形強調 ─────────────────────────
      activate("#an04-t-rect", "#an04-t-arrow", 3.25);

      // 再試行の行を囲む角丸矩形が広がる（0.4s）
      tl.fromTo(
        "#an04-rect",
        { scaleX: 0.42, scaleY: 0.55, opacity: 0 },
        { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        3.34,
      );

      tl.fromTo(
        "#an04-label-3",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        3.28,
      );
      tl.to("#an04-label-3", { opacity: 0, duration: 0.26, ease: "power3.in" }, 4.44);
      tl.set("#an04-label-3", { opacity: 0 }, 4.7);

      // ── Scene 4 (4.7–6.4s) ステップ ─────────────────────────
      activate("#an04-t-step", "#an04-t-rect", 4.75);

      // ① モザイクした KPI カードへ、② 囲んだ表の行へ。0.3s 間隔で弾んで置かれる。
      tl.fromTo(
        "#an04-badge-1",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.6)" },
        4.84,
      );
      tl.fromTo(
        "#an04-badge-2",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.6)" },
        5.14,
      );

      tl.fromTo(
        "#an04-label-4",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        4.78,
      );

      // 最後の約 0.6s は静止。注釈が全部乗った板をそのまま読ませる。

      // ── Scene 5 (6.4–8.0s) 保存 ───────────────────────────
      // ラベル列を引き取り、PNG保存ボタンを押して結果を見せる。
      tl.to("#an04-label-4", { opacity: 0, duration: 0.24, ease: "power3.in" }, 6.16);
      tl.set("#an04-label-4", { opacity: 0 }, 6.4);

      // press-release-spring: 沈んでからスプリングで戻る
      tl.to("#an04-save", { scale: 0.96, duration: 0.12, ease: "power1.in" }, 6.45);
      tl.to("#an04-save", { scale: 1, duration: 0.34, ease: "back.out(1.8)" }, 6.57);

      // 保存されたファイル名がせり上がる
      tl.fromTo(
        "#an04-savedchip",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        6.72,
      );

      window.__timelines["04-annotate"] = tl;
    })();
