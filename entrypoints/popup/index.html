<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shotcraft</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <button id="capture-visible" type="button">
        <span class="icon" data-icon="camera"></span>
        <span class="label">表示範囲をキャプチャ</span>
      </button>
      <div
        class="delay-row"
        role="group"
        aria-label="キャプチャまでの待機時間"
      >
        <span class="icon" data-icon="timer"></span>
        <div class="delay-segments" id="capture-delay"></div>
      </div>
      <button id="capture-region" type="button">
        <span class="icon" data-icon="crop"></span>
        <span class="label">範囲を選択してキャプチャ</span>
      </button>
      <button id="capture-full-page" type="button">
        <span class="icon" data-icon="fullPage"></span>
        <span class="label">ページ全体をキャプチャ</span>
      </button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
