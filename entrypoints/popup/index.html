<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shotcraft</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="capture-methods" role="group" aria-label="キャプチャ方法">
        <button id="capture-visible" class="capture-method" type="button">
          <span class="icon" data-icon="camera"></span>
          <span class="label">表示範囲をキャプチャ</span>
        </button>
        <button id="capture-region" class="capture-method" type="button">
          <span class="icon" data-icon="crop"></span>
          <span class="label">範囲を選択してキャプチャ</span>
        </button>
        <button id="capture-full-page" class="capture-method" type="button">
          <span class="icon" data-icon="fullPage"></span>
          <span class="label">ページ全体をキャプチャ</span>
        </button>
      </div>

      <hr class="divider" />

      <div class="delay-row" role="group" aria-label="キャプチャまでの遅延">
        <span class="icon" data-icon="timer"></span>
        <span class="delay-label">遅延</span>
        <div class="delay-segments" id="capture-delay"></div>
      </div>
      <p class="delay-note">表示範囲・ページ全体のキャプチャに適用されます</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
